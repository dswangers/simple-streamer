<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080, initial-scale=1" />
<title>Simple Streamer</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --text: #e8e9ec;
    --muted: #9a9fa8;
    --accent: #4da3ff;
    --border: #2a2e37;
    --danger: #e5484d;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 20px;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 720px;
    padding: 48px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 32px;
  }
  p.subtitle {
    margin: 0 0 32px;
    color: var(--muted);
    font-size: 18px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 16px 18px;
    font-size: 20px;
    margin-bottom: 8px;
  }
  input[type="text"]:focus {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .hint {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px;
  }
  button {
    width: 100%;
    background: var(--accent);
    color: #05131f;
    border: none;
    border-radius: 8px;
    padding: 16px;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
  }
  button:focus {
    outline: 3px solid #fff;
    outline-offset: 2px;
  }
  button:disabled {
    opacity: 0.6;
  }
  .status {
    min-height: 24px;
    margin-top: 16px;
    font-size: 15px;
    text-align: center;
  }
  .status.error { color: var(--danger); }
  .status.info { color: var(--muted); }
</style>
</head>
<body>
  <form class="card" id="connectForm">
    <h1>Simple Streamer</h1>
    <p class="subtitle">Enter the address of the simple-streamer server running on your network.</p>

    <label for="serverUrl">Server address</label>
    <input type="text" id="serverUrl" inputmode="url" autocomplete="off" placeholder="http://192.168.1.50:4173" />
    <p class="hint">This is the machine running <code>npm start</code> for simple-streamer — use its LAN IP and port (default 4173), not "localhost".</p>

    <button type="submit" id="connectBtn">Connect</button>
    <p class="status" id="status"></p>
  </form>

  <script>
    var STORAGE_KEY = 'ss_server_url';
    var input = document.getElementById('serverUrl');
    var form = document.getElementById('connectForm');
    var button = document.getElementById('connectBtn');
    var statusEl = document.getElementById('status');

    var saved = '';
    try { saved = localStorage.getItem(STORAGE_KEY) || ''; } catch (e) {}
    input.value = saved;

    // Repeat launches: jump straight to "Connect" (still editable via Up).
    if (saved) {
      button.focus();
    } else {
      input.focus();
    }

    // Minimal D-pad nav for this two-control screen (no mouse on a TV).
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && document.activeElement === input) {
        e.preventDefault();
        button.focus();
      } else if (e.key === 'ArrowUp' && document.activeElement === button) {
        e.preventDefault();
        input.focus();
      }
    });

    function normalizeUrl(raw) {
      var value = (raw || '').trim();
      if (!value) return null;
      if (!/^https?:\/\//i.test(value)) value = 'http://' + value;
      return value.replace(/\/+$/, '');
    }

    function setStatus(message, kind) {
      statusEl.textContent = message || '';
      statusEl.className = 'status' + (kind ? ' ' + kind : '');
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var url = normalizeUrl(input.value);
      if (!url) {
        setStatus('Enter a server address first.', 'error');
        input.focus();
        return;
      }

      button.disabled = true;
      setStatus('Connecting to ' + url + ' ...', 'info');

      var finished = false;
      var timeoutId = setTimeout(function () {
        if (finished) return;
        finished = true;
        proceed('Taking a while to respond — continuing anyway.');
      }, 4000);

      function proceed() {
        try { localStorage.setItem(STORAGE_KEY, url); } catch (e) {}
        window.location.href = url + '/index.html';
      }

      fetch(url + '/api/config')
        .then(function () {
          if (finished) return;
          finished = true;
          clearTimeout(timeoutId);
          proceed();
        })
        .catch(function () {
          if (finished) return;
          finished = true;
          clearTimeout(timeoutId);
          button.disabled = false;
          setStatus('Could not reach that address. Check the IP/port and that both devices are on the same network.', 'error');
        });
    });
  </script>
</body>
</html>
