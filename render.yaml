# Render Blueprint — deploys the backend (server.js) plus a Postgres
# database. See render/README.md for the walkthrough, including the one-time
# schema load and the free-plan caveats.
#
# This file has to sit at the repo root for Render to auto-detect it; the
# docs for it live in render/.

services:
  - type: web
    name: simple-streamer
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      # Set these in the Render dashboard when prompted — never commit them.
      - key: TMDB_API_KEY
        sync: false
      - key: OMDB_API_KEY
        sync: false
      # Required here: the service is public, and nothing else in the app
      # authenticates callers.
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: simple-streamer-db
          property: connectionString

databases:
  - name: simple-streamer-db
    plan: free
